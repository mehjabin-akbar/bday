<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday</title>
    <style>
        body {
            background: radial-gradient(ellipse at center, #1b0034 0%, #0a0016 100%);
            font-family: 'Segoe UI', 'Trebuchet MS', sans-serif;
            margin: 0;
            padding: 0;
  overflow: hidden;
}

h1 {
  text-align: center;
  font-size: 3em;
  margin-top: 1.5em;
  color: #ffdd44;
  text-shadow:
    1px 1px 0 #000,
    2px 2px 3px rgba(0, 0, 0, 0.5),
    0 0 10px #ffcc00;
  letter-spacing: 2px;
}

h2 {
  text-align: center;
  font-size: 1.5em;
  margin-bottom: 2em;
  color: #ffaa33;
  text-shadow:
    1px 1px 0 #000,
    2px 2px 3px rgba(0, 0, 0, 0.5),
    0 0 5px #ff8800;
  letter-spacing: 1px;
}

.cake-container {
  flex-grow: 1;
  position: relative;
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  padding-bottom: 5em; /* Give room for plate */
}

.mmd_bday_cake {
  position: absolute;
  top: 0;
  right: 0;
  bottom: 0;
  left: 0;
  margin: auto;
  width: 200px;
  height: 40px;
  background: #704b33;
  border-radius: 100%;
  border-radius: 100%;
  box-shadow: 0px 4px 0px #633e26, 0px 8px 0px #633e26, 0px 12px 0px #633e26,
    0px 16px 0px #633e26, 0px 20px 0px #633e26, 0px 24px 0px #633e26,
    0px 28px 0px #633e26, 0px 32px 0px #c9243d, 0px 36px 0px #c9243d,
    0px 40px 0px #f8ecc9, 0px 44px 0px #f8ecc9, 0px 48px 0px #f8ecc9,
    0px 52px 0px #f8ecc9, 0px 56px 0px #633e26, 0px 60px 0px #633e26,
    0px 64px 0px #633e26, 0px 68px 0px #633e26, 0px 72px 0px #633e26,
    0px 76px 0px #633e26, 0px 80px 0px #633e26;
}

.mmd_bday_cake:before {
  position: absolute;
  right: 0;
  top: 79px;
  left: -25px;
  margin: auto;
  content: "";
  width: 250px;
  height: 50px;
  border-radius: 100%;
  background: #fff;
  box-shadow: 0px 6px 0px rgba(0, 0, 0, 0.1);
  z-index: -1;
}

.mmd_bday_cake:after {
  position: absolute;
  top: -30px;
  left: 0;
  right: 0;
  margin: 0;
  bottom: 0;
  /* Update your AGE here! */
  content: "28";
  font-family: "Impact";
  font-size: 3em;
  font-weight: bold;
  color: #e9f2f9;
  -webkit-text-stroke: 2px #ff4081;
   text-shadow: 0 0 10px #ff4081;
  text-align: center;
}


/*Candles*/
.candle {
  position: absolute;
  top: -30px;
  left: 50%;
  transform: translateX(-50%);
  width: 4px;
  height: 15px;
  background: #c2c2c2;
  border-radius: 2px;
  box-shadow: 0 -4px 10px rgba(255, 200, 0, 0.5);
  z-index: 1;
}

/* Flame */
.candle::before {
  content: "";
  position: absolute;
  top: -12px;
  left: 50%;
  transform: translateX(-50%);
  width: 10px;
  height: 14px;
  background: orange;
  border-radius: 50% 50% 50% 50%;
  box-shadow: 0 0 10px orange;
  animation: flicker 1s infinite ease-in-out;
  z-index: 3;
}

@keyframes flicker {
  0%   { opacity: 1; transform: scaleY(1) translateX(-50%); }
  50%  { opacity: 0.7; transform: scaleY(0.9) translateX(-50%); }
  100% { opacity: 1; transform: scaleY(1) translateX(-50%); }
}

.gift-btn {
  display: block;
  margin: 40px auto;
  padding: 12px 25px;
  font-size: 1.2em;
  color: white;
  background: linear-gradient(45deg, #ff4da6, #ff1a75);
  border: none;
  border-radius: 30px;
  cursor: pointer;

  box-shadow: 0 0 15px #ff1a75;
  transition: all 0.3s ease;

  animation: floatBtn 3s ease-in-out infinite;
}

/* Floating + breathing effect */
@keyframes floatBtn {
  0% {
    transform: translateY(0) scale(1);
  }
  50% {
    transform: translateY(-8px) scale(1.05);
  }
  100% {
    transform: translateY(0) scale(1);
  }
}

/* Hover effect */
.gift-btn:hover {
  transform: scale(1.1);
  box-shadow: 0 0 25px #ff4da6, 0 0 40px #ff1a75;
}

/* Click effect */
.gift-btn:active {
  transform: scale(0.95);
}
.gift-container {
  display: flex;
  justify-content: center;
  align-items: center;
  margin-top: 150px;
}

/* MODAL BACKGROUND */
.modal {
  display: none;
  position: fixed;
  z-index: 1000;
  left: 0;
  top: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.85);
  justify-content: center;
  align-items: center;
}

.modal-content {
  background: #1a001f;
  padding: 30px;
  border-radius: 20px;

  width: 95%;
  max-width: 600px;

  text-align: center;
  box-shadow: 0 0 30px #ff1a75;

  animation: popIn 0.4s ease;
}
/* MODAL BOX */
.gift-image-frame {
  margin-top: 15px;
  padding: 12px;

  border-radius: 20px;
  background: linear-gradient(145deg, #ff4da6, #660033);

  box-shadow:
    0 0 25px #ff1a75,
    inset 0 0 10px rgba(255,255,255,0.15);
}

/* IMAGE (stable, no animation) */
.gift-image-frame img {
  width: 100%;
  max-height: 50vh;
  object-fit: contain;   /* IMPORTANT FIX */
  border-radius: 15px;
  background: #000; /* optional: adds clean background if space appears */
}

@keyframes popIn {
  from { transform: scale(0.7); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}

/* CLOSE BUTTON */
.close {
  float: right;
  font-size: 25px;
  cursor: pointer;
  color: #ff4da6;
}

/* FRAME */
.photo-frame {
  padding: 15px;
  border-radius: 20px;
  background: linear-gradient(145deg, #ff4da6, #660033);
  box-shadow:
    0 0 20px #ff1a75,
    inset 0 0 10px rgba(255,255,255,0.2);
  margin-top: 15px;
}

/* COLLAGE GRID */
.collage {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 8px;
}

/* IMAGES */
.collage img {
  width: 100%;
  height: 100px;
  object-fit: cover;
  border-radius: 10px;
  transition: 0.3s;
}

/* HOVER EFFECT */
.collage img:hover {
  transform: scale(1.1);
}
/* MESSAGE */
#surpriseText {
  margin-top: 15px;
  color: #ffccff;
  font-size: 1em;
}
/* HEART PARTICLES */
.heart-particle {
  position: fixed;
  bottom: -20px;
  font-size: 20px;
  color: #ff4da6;
  animation: floatHeart 4s linear forwards;
  pointer-events: none;
}

@keyframes floatHeart {
  0% {
    transform: translateY(0) scale(1);
    opacity: 1;
  }
  100% {
    transform: translateY(-100vh) scale(1.5);
    opacity: 0;
  }
}
</style>
</head>

<body>
<!-- Happy 28th Birthday Mike (August 1st, 2025) -->
<h1>Happy Birthday, Dear <span class="heart">❤️</span></h1>
<h2>Here's a Cake to Celebrate 🎉</h2>
<div class="cake-container">
  <div class="mmd_bday_cake">
    <span class="candle"></span>
  </div>
</div>

<div class="gift-container">
  <button class="gift-btn" onclick="openGift()">🎁 Open Gift</button>
</div>

<!-- gift open -->
<div class="modal" id="giftModal">
  <div class="modal-content">

    <span class="close" onclick="closeGift()">&times;</span>

    <h2>For You ❤️</h2>

    <!-- Photo Gallery -->
   <div class="photo-frame">
<div class="gift-image-frame">
  <img src="photo.png" alt="Memory">
</div>
</div>

    <!-- Typing Message -->
    <p id="surpriseText"></p>

  </div>
</div>

<script>
function openGift() {
  const modal = document.getElementById("giftModal");
  modal.style.display = "flex";

  // Play music
  const music = document.getElementById("bgMusic");
  music.currentTime = 0;
  music.play();

  startTyping();
  startHearts();
}

function closeGift() {
  document.getElementById("giftModal").style.display = "none";
}
/* Typing Effect */
function startTyping() {
  const text = "Wishing you happiness, love, and everything beautiful in life ❤️";
  let i = 0;
  const speed = 40;

  const output = document.getElementById("surpriseText");
  output.innerHTML = "";

  function type() {
    if (i < text.length) {
      output.innerHTML += text.charAt(i);
      i++;
      setTimeout(type, speed);
    }
  }

  type();
}
</script>
<script>
let heartInterval; // control variable

function startHearts() {
  if (heartInterval) return; // prevent multiple loops

  heartInterval = setInterval(() => {
    const heart = document.createElement("div");
    heart.className = "heart-particle";
    heart.innerHTML = "❤️";

    heart.style.left = Math.random() * 100 + "vw";
    heart.style.fontSize = (Math.random() * 20 + 15) + "px";

    document.body.appendChild(heart);

    setTimeout(() => {
      heart.remove();
    }, 5000);
  }, 250); // speed of hearts
}

function stopHearts() {
  clearInterval(heartInterval);
  heartInterval = null;
}
</script>

<script>
const music = document.getElementById("bgMusic");

function playMusic() {
  music.volume = 0;
  music.play().then(() => {
    // smooth fade-in
    let vol = 0;
    const fade = setInterval(() => {
      if (vol < 1) {
        vol += 0.05;
        music.volume = vol;
      } else {
        clearInterval(fade);
      }
    }, 200);
  }).catch(() => {
    // autoplay blocked → wait for user click
    document.addEventListener("click", () => {
      music.play();
    }, { once: true });
  });
}

window.addEventListener("load", playMusic);
</script>
<audio id="bgMusic" src="nastelbom-happy-birthday-495860.mp3"></audio>
</body>
</html>
